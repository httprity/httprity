<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 64" width="420" height="64" role="img" aria-label="Sign the guestbook">
  <defs>
    <pattern id="gb-pink-20" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="5.5" cy="5.5" r="2.1" fill="#f0338c"/>
    </pattern>
    <pattern id="gb-blue-40" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <circle cx="5.5" cy="5.5" r="3.0" fill="#1257a8"/>
    </pattern>
    <filter id="gb-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="9" result="n">
        <animate attributeName="seed" values="9;21;4;33;9" dur="1.4s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.55 0"/>
    </filter>
  </defs>

  <rect width="420" height="64" fill="#f4efe3"/>
  <!-- Pink tint block, then a blue halftone disc peeking in from the right -->
  <rect x="8" y="8" width="404" height="48" fill="url(#gb-pink-20)"/>
  <circle cx="390" cy="32" r="30" fill="url(#gb-blue-40)">
    <animateTransform attributeName="transform" type="rotate" from="0 390 32" to="360 390 32" dur="40s" repeatCount="indefinite"/>
  </circle>

  <!-- Misregistered label: blue plate drifts, pink sits on top -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; 2 -1; 0 1; -1 0; 0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
    <text x="22" y="42" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="26" font-weight="800" fill="#1257a8" letter-spacing="-1">SIGN THE GUESTBOOK</text>
  </g>
  <text x="26" y="39" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="26" font-weight="800" fill="#f0338c" letter-spacing="-1">SIGN THE GUESTBOOK</text>

  <!-- Arrow that nudges toward the link -->
  <text x="342" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#101a2c">↗
    <animate attributeName="x" values="342;346;342" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </text>

  <rect x="8" y="8" width="404" height="48" fill="none" stroke="#101a2c" stroke-width="1" opacity="0.7"/>
  <rect width="420" height="64" filter="url(#gb-grain)" opacity="0.6"/>
</svg>
